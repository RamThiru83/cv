name: Rebuild CVs

# Runs on the 1st of every month (03:17 UTC) and on demand (Actions tab > Rebuild CVs > Run workflow).
# Reads the live CV content from the site database, rebuilds the Word and PDF CVs, checks them,
# and commits them. ICMR_Short_Resume is not rebuilt here (it needs the ICMR template).
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SB_URL: https://vpcfegnfzulpxcmoittm.supabase.co
      SB_KEY: sb_publishable_bEsBtP1gqRe9ovzKci91Uw_gTHt02ov
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live CV content
        run: |
          curl -fsS "$SB_URL/rest/v1/site_content?key=eq.cv_data&select=value" -H "apikey: $SB_KEY" -o live_raw.json
          python3 - <<'PY'
          import json
          rows = json.load(open('live_raw.json'))
          d = rows[0]['value']
          for k in ('PERSON','BIBLIO','PUBS','GRANTS_ONGOING','GRANTS_COMPLETED','PATENTS','AWARDS','POSITIONS','EDUCATION'):
              assert d.get(k), 'missing ' + k
          assert len(d['PUBS']) >= 60, 'too few publications: %d' % len(d['PUBS'])
          for k in ('dob','mobile','phone'):
              d['PERSON'].pop(k, None)
          json.dump(d, open('live.json','w'), ensure_ascii=False)
          print('publications:', len(d['PUBS']), '| version:', d.get('DATA_VERSION','')[:60])
          PY

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-crosextra-carlito fonts-liberation poppler-utils
          pip install python-docx

      - name: Build Word files
        run: |
          rm -rf build && mkdir build
          CV_JSON=live.json CV_PUBLIC=1 python3 generator/build_cvs.py build
          rm -f build/cv_data.json

      - name: Convert to PDF and check
        run: |
          cd build
          soffice --headless --convert-to pdf *.docx >/dev/null 2>&1
          python3 - <<'PY'
          import subprocess, re, sys
          limits = {'Two_Page_CV': (2, 2), 'Short_Bio': (1, 1), 'Full_CV': (5, 14), 'Publication_List': (2, 8), 'DBT_Biodata': (2, 8), 'BIRAC_Biodata': (2, 8)}
          bad = []
          for name, (lo, hi) in limits.items():
              out = subprocess.run(['pdfinfo', name + '.pdf'], capture_output=True, text=True).stdout
              pages = int(re.search(r'Pages:\s+(\d+)', out).group(1))
              print(name, pages, 'pages')
              if not lo <= pages <= hi: bad.append((name, pages))
          if bad:
              print('Page-count check failed:', bad); sys.exit(1)
          PY

      - name: Publish rebuilt files
        run: |
          for n in BIRAC_Biodata DBT_Biodata Full_CV Publication_List Short_Bio Two_Page_CV; do
            cp "build/$n.docx" "docx/$n.docx"
            cp "build/$n.pdf" "pdf/$n.pdf"
          done
          cp live.json cv_data.json
          git config user.name "cv-rebuild"
          git config user.email "actions@users.noreply.github.com"
          git add docx pdf cv_data.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Monthly CV rebuild from live site content"
          git push

      - name: Refresh the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
