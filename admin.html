<!doctype html>
<html lang="en"><head>
<title>Admin | Ramachandran Thiruvengadam</title>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
body{padding-bottom:5rem}
.abar{border-bottom:1px solid var(--rule);background:var(--surface)}
.abar .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:60px}
.abar .mark{font-size:1rem}.abar .r{display:flex;gap:.5rem;align-items:center}
.login{max-width:26rem;margin:5rem auto}
.login input{width:100%;margin:.3rem 0 1rem}
.layout{display:grid;gap:1.4rem;margin-top:1.6rem}
@media(min-width:62rem){.layout{grid-template-columns:14rem 1fr;gap:2.4rem;align-items:start}.side{position:sticky;top:20px}}
.side{display:flex;gap:.3rem;overflow-x:auto;padding-bottom:.4rem}
@media(min-width:62rem){.side{flex-direction:column;overflow:visible}}
.side button{font:600 .9rem var(--sans);text-align:left;white-space:nowrap;background:none;border:0;border-radius:10px;padding:.6rem .85rem;color:var(--muted);cursor:pointer}
.side button:hover{background:var(--sunk);color:var(--ink)}
.side button[aria-current=true]{background:var(--tint);color:var(--accent)}
.panel>h2{font-size:1.7rem;margin-bottom:.3rem}
.panel .sub{color:var(--muted);margin:0 0 1.4rem;max-width:42rem}
.note{background:var(--tint);border-radius:12px;padding:.8rem 1rem;font-size:.88rem;margin:0 0 1.4rem;color:var(--ink)}
.note.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.lh{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin:1.8rem 0 .8rem}
.lh h3{margin:0}.lh .tools{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.lh input[type=search]{width:14rem;max-width:100%}
.row{border:1px solid var(--rule);border-radius:14px;background:var(--surface);margin:0 0 .55rem}
.row[open]{box-shadow:var(--shadow)}
.row summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2rem 1fr;gap:.2rem .6rem;padding:.7rem .9rem;align-items:baseline}
.row summary::-webkit-details-marker{display:none}
.row .n{font:600 .78rem var(--sans);color:var(--muted)}
.row .t{font-weight:600;font-size:.94rem;line-height:1.35;overflow-wrap:anywhere}
.row .s{grid-column:2;font-size:.8rem;color:var(--muted)}
.fields{display:grid;gap:.8rem;padding:.2rem .9rem .9rem;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))}
.fields .wide{grid-column:1/-1}
.fields label,.kv label{font-size:.78rem;font-weight:700;color:var(--muted);display:block;margin:0 0 .25rem}
.fields input,.fields textarea,.fields select,.kv input,.kv textarea{width:100%}
textarea{min-height:4.6rem;resize:vertical}
.ra{display:flex;gap:.4rem;padding:0 .9rem .9rem;flex-wrap:wrap}
.btn.danger{border-color:var(--err);color:var(--err);background:transparent}.btn.danger:hover{background:color-mix(in srgb,var(--err) 12%,transparent)}
.btn.danger.armed{background:var(--err);color:#fff}
.kv{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}.kv .wide{grid-column:1/-1}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--rule);box-shadow:0 -8px 24px rgba(0,0,0,.08);z-index:40}
.bottom .wrap{display:flex;gap:.8rem;align-items:center;justify-content:space-between;padding-top:.7rem;padding-bottom:.7rem;flex-wrap:wrap}
.bottom .msg{font-size:.9rem;font-weight:600}.bottom .msg.dirty{color:var(--warn)}.bottom .msg.ok{color:var(--accent)}.bottom .msg.err{color:var(--err)}
table.log{width:100%;border-collapse:collapse;font-size:.84rem}
table.log th,table.log td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--rule);vertical-align:top}
table.log th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto}
.hist{display:flex;justify-content:space-between;align-items:center;gap:1rem;border:1px solid var(--rule);border-radius:12px;padding:.7rem 1rem;margin:0 0 .5rem;background:var(--surface)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="abar"><div class="wrap"><a class="mark" href="index.html">Ramachandran Thiruvengadam &middot; Admin</a><div class="r" id="top-r" hidden><a class="btn ghost sm" href="index.html" target="_blank" rel="noopener">View site</a><button class="btn ghost sm" id="out" type="button">Sign out</button></div></div></div>

<main class="wrap" id="main">
  <section class="login card" id="login">
    <h1 style="font-size:1.9rem;margin-bottom:.4rem">Admin sign-in</h1>
    <p style="color:var(--muted);margin:0 0 1.2rem">Edit every page of the website. Changes go live when you press Publish.</p>
    <form id="lf">
      <label for="pw" style="font-weight:600;font-size:.88rem">Passphrase</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit" id="lb">Sign in</button>
      <p class="status" id="ls" role="status"></p>
    </form>
  </section>

  <div class="layout" id="app" hidden>
    <nav class="side" id="side" aria-label="Sections"></nav>
    <section class="panel" id="panel"></section>
  </div>
</main>

<div class="bottom" id="bottom" hidden><div class="wrap">
  <span class="msg" id="bmsg" role="status">No changes</span>
  <span style="display:flex;gap:.5rem;flex-wrap:wrap">
    <button class="btn ghost sm" id="bk" type="button">Download backup</button>
    <button class="btn ghost sm" id="dis" type="button" disabled>Discard</button>
    <button class="btn sm" id="pub" type="button" disabled>Publish changes</button>
  </span>
</div></div>

<script src="site.js"></script>
<script>
(function () {
  const FN = 'https://vpcfegnfzulpxcmoittm.supabase.co/functions/v1/cv-admin';
  const E = CV.esc, $ = (s) => document.querySelector(s);
  let token = '', S = null, saved = '', dirty = false, tab = 'site', hist = [], openRow = '';
  try { token = sessionStorage.getItem('cvadmin') || ''; } catch (_) {}

  const POS = ['first', 'second', 'corresponding', 'last', 'co-author', 'group member'];
  const SITE_LABELS = {
    hero_eyebrow: 'Home: small line above the headline', hero_title: 'Home: headline', hero_lede: 'Home: introduction', panel_title: 'Home: partners panel title', panel_sub: 'Home: partners panel sub-heading', 
    focus_title: 'Home: research heading', focus_sub: 'Home: research sub-heading', band_title: 'Home: download banner title', band_text: 'Home: download banner text',
    research_title: 'Research page: title', research_lede: 'Research page: introduction', about_title: 'About page: title', about_lede: 'About page: introduction', about_bio: 'About page: main paragraph',
    pubs_title: 'Publications page: title', pubs_lede: 'Publications page: introduction', dl_title: 'Downloads page: title', dl_lede: 'Downloads page: introduction', footer_text: 'Footer: description'
  };
  const AREA = new Set(['panel_sub', 'about_bio', 'hero_lede', 'focus_sub', 'band_text', 'research_lede', 'about_lede', 'pubs_lede', 'dl_lede', 'footer_text']);
  const LISTS = {
    PUBS: { label: 'Publications', cols: [['Authors', 'area'], ['Title', 'area'], ['Journal', 'text'], ['Year', 'text'], ['Volume and pages', 'text'], ['DOI', 'text'], ['PMID', 'text'], ['Authorship role', 'select', POS]], t: 1, s: (r) => [r[3], r[2], r[7]].filter(Boolean).join(' · '), search: true, sortYear: true, wide: [0, 1] },
    GRANTS_ONGOING: { label: 'Ongoing projects', cols: [['Title', 'area'], ['Funding agency', 'text'], ['Role', 'text'], ['Period', 'text'], ['Amount', 'text'], ['Note', 'text']], t: 0, s: (r) => [r[1], r[2], r[3]].filter(Boolean).join(' · '), wide: [0] },
    GRANTS_COMPLETED: { label: 'Completed projects', cols: [['Title', 'area'], ['Funding agency', 'text'], ['Role', 'text'], ['Period', 'text'], ['Amount', 'text'], ['Note', 'text']], t: 0, s: (r) => [r[1], r[2], r[3]].filter(Boolean).join(' · '), wide: [0] },
    PATENTS: { label: 'Patents', cols: [['Title', 'area'], ['Application or patent number', 'text'], ['Status', 'text'], ['Contribution', 'area']], t: 0, s: (r) => [r[1], r[2]].filter(Boolean).join(' · '), wide: [0, 3] },
    POSITIONS: { label: 'Positions', cols: [['Institution', 'text'], ['Title', 'text'], ['From', 'text'], ['To', 'text']], t: 1, s: (r) => [r[0], r[2] + ' to ' + r[3]].join(' · '), wide: [0, 1] },
    EDUCATION: { label: 'Education', cols: [['Institution', 'text'], ['Degree', 'text'], ['Year', 'text']], t: 1, s: (r) => [r[0], r[2]].join(' · '), wide: [0] },
    AWARDS: { label: 'Awards', cols: [['Award', 'area'], ['Date', 'text']], t: 0, s: (r) => r[1], wide: [0] },
    ROLES: { label: 'Editorial and advisory roles', str: true },
    TEACHING: { label: 'Teaching', str: true },
    LEADERSHIP: { label: 'Leadership and programmes', str: true },
    WORKSHOPS: { label: 'Workshops organised', str: true },
    'SITE.partners': { label: 'Partners panel rows', cols: [['Heading', 'text'], ['Names (separate with semicolons)', 'area']], t: 0, s: (r) => r[1], wide: [0, 1] },
    'SITE.themes': { label: 'Research themes', cols: [['Title', 'text'], ['Short text (Home page card)', 'area'], ['Detailed text (Research page)', 'area']], t: 0, s: (r) => r[1], wide: [0, 1, 2] }
  };
  const TABS = [['site', 'Site text'], ['SITE.themes', 'Research themes'], ['SITE.partners', 'Partners panel'], ['bio', 'Profile and bio'], ['PUBS', 'Publications'], ['projects', 'Projects'], ['PATENTS', 'Patents'], ['career', 'Positions and education'], ['AWARDS', 'Awards'], ['service', 'Roles and teaching'], ['person', 'Person and metrics'], ['log', 'Download log'], ['hist', 'Version history']];
  const PERSON_AREA = new Set(['institute_long', 'address', 'domain']);
  const BIBLIO_LABELS = { pubmed_10y: 'PubMed count (10 years)', h_index: 'h-index', citations: 'Citations', i10: 'i10-index', papers_listed: 'Papers listed', patents: 'Patents', academies: 'Academy fellowships' };

  const getP = (p) => p.split('.').reduce((o, k) => (o == null ? o : o[k]), S);
  const snap = () => JSON.stringify(S);
  function setDirty() {
    dirty = snap() !== saved;
    const m = $('#bmsg'); m.className = 'msg' + (dirty ? ' dirty' : ''); m.textContent = dirty ? 'Unsaved changes' : 'No changes';
    $('#pub').disabled = !dirty; $('#dis').disabled = !dirty;
  }
  const msg = (t, c) => { const m = $('#bmsg'); m.className = 'msg ' + (c || ''); m.textContent = t; };

  async function api(action, extra) {
    const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action, token }, extra || {})), signal: AbortSignal.timeout(30000) });
    let j = {}; try { j = await r.json(); } catch (_) {}
    if (r.status === 401 && action !== 'login') { signedOut('Your session expired. Sign in again; your edits are still on this page.'); }
    if (!r.ok) throw new Error(j.error || ('Request failed (' + r.status + ')'));
    return j;
  }
  function signedOut(note) {
    token = ''; try { sessionStorage.removeItem('cvadmin'); } catch (_) {}
    $('#login').hidden = false; $('#app').hidden = !S; $('#bottom').hidden = !S; $('#top-r').hidden = true;
    if (note) { $('#ls').className = 'status err'; $('#ls').textContent = note; }
  }

  function normalise(d) {
    d.SITE = Object.assign({}, CV.DEFAULT_SITE, d.SITE || {});
    if (!Array.isArray(d.SITE.themes)) d.SITE.themes = CV.DEFAULT_SITE.themes.map((t) => t.slice());
    if (!Array.isArray(d.SITE.partners)) d.SITE.partners = CV.DEFAULT_SITE.partners.map((t) => t.slice());
    delete d.SITE.hero_tag;
    ['PUBS', 'GRANTS_ONGOING', 'GRANTS_COMPLETED', 'PATENTS', 'AWARDS', 'POSITIONS', 'EDUCATION', 'ROLES', 'TEACHING', 'LEADERSHIP', 'WORKSHOPS'].forEach((k) => { if (!Array.isArray(d[k])) d[k] = []; });
    d.PERSON = d.PERSON || {}; d.BIBLIO = d.BIBLIO || {};
    delete d.PERSON.dob; delete d.PERSON.mobile; delete d.PERSON.phone;
    return d;
  }

  async function start() {
    $('#login').hidden = true; $('#top-r').hidden = false;
    let seeded = false;
    const r = await api('get');
    hist = r.history || [];
    if (r.content) S = normalise(r.content);
    else {
      const j = await fetch('cv_data.json').then((x) => x.json());
      S = normalise(j); seeded = true;
    }
    saved = seeded ? '' : snap();
    $('#app').hidden = false; $('#bottom').hidden = false;
    buildSide(); render(); setDirty();
    if (seeded) { dirty = true; msg('Starting from the published static copy. Publish to make the site editable.', 'dirty'); $('#pub').disabled = false; }
  }

  function buildSide() {
    $('#side').innerHTML = TABS.map(([k, t]) => '<button type="button" data-tab="' + k + '"' + (k === tab ? ' aria-current="true"' : '') + '>' + E(t) + '</button>').join('');
  }

  const input = (kind, val, attrs, opts) => {
    if (kind === 'area') return '<textarea ' + attrs + '>' + E(val) + '</textarea>';
    if (kind === 'select') return '<select ' + attrs + '>' + (opts.includes(val) || !val ? '' : '<option>' + E(val) + '</option>') + opts.map((o) => '<option' + (o === val ? ' selected' : '') + '>' + E(o) + '</option>').join('') + '</select>';
    return '<input type="text" ' + attrs + ' value="' + E(val) + '">';
  };

  function listEditor(path) {
    const cfg = LISTS[path], arr = getP(path) || [];
    let h = '<div class="lh"><h3>' + E(cfg.label) + ' <span class="chip n">' + arr.length + '</span></h3><div class="tools">';
    if (cfg.search) h += '<input type="search" placeholder="Search" aria-label="Search ' + E(cfg.label) + '" data-q="' + path + '">';
    if (cfg.sortYear) h += '<button class="btn ghost sm" type="button" data-a="sort" data-p="' + path + '">Sort newest first</button>';
    h += '<button class="btn sm" type="button" data-a="add" data-p="' + path + '">Add</button></div></div><div data-list="' + path + '">';
    arr.forEach((r, i) => {
      const key = path + ':' + i;
      let title, sub = '', body = '';
      if (cfg.str) {
        title = r || '(empty)';
        body = '<div class="fields"><div class="wide"><label>Text</label>' + input('area', r, 'data-p="' + path + '" data-i="' + i + '"') + '</div></div>';
      } else {
        title = r[cfg.t] || '(untitled)'; sub = cfg.s(r) || '';
        body = '<div class="fields">' + cfg.cols.map((c, ci) => '<div' + (cfg.wide && cfg.wide.includes(ci) ? ' class="wide"' : '') + '><label>' + E(c[0]) + '</label>' + input(c[1], r[ci] || '', 'data-p="' + path + '" data-i="' + i + '" data-c="' + ci + '"', c[2]) + '</div>').join('') + '</div>';
      }
      const text = (cfg.str ? r : r.join(' ')).toLowerCase();
      h += '<details class="row" data-text="' + E(text) + '"' + (openRow === key ? ' open' : '') + '><summary><span class="n">' + (i + 1) + '</span><span class="t">' + E(title) + '</span>' + (sub ? '<span class="s">' + E(sub) + '</span>' : '') + '</summary>' + body +
        '<div class="ra"><button class="btn ghost sm" type="button" data-a="up" data-p="' + path + '" data-i="' + i + '" aria-label="Move up">Move up</button><button class="btn ghost sm" type="button" data-a="down" data-p="' + path + '" data-i="' + i + '" aria-label="Move down">Move down</button><button class="btn danger sm" type="button" data-a="del" data-p="' + path + '" data-i="' + i + '">Delete</button></div></details>';
    });
    return h + '</div>';
  }

  function kvForm(obj, name, labels, areaSet) {
    return '<div class="kv">' + Object.keys(obj).map((k) => {
      const area = areaSet && areaSet.has(k);
      return '<div' + (area ? ' class="wide"' : '') + '><label>' + E((labels && labels[k]) || k) + '</label>' + input(area ? 'area' : 'text', obj[k], 'data-o="' + name + '" data-k="' + E(k) + '"') + '</div>';
    }).join('') + '</div>';
  }

  const intro = {
    site: ['Site text', 'Headlines and introductions shown on the pages. Leave a field as it is to keep the current wording.'],
    'SITE.partners': ['Partners panel', 'The panel beside the headline on the Home page. Separate the names in each row with semicolons.'],
    'SITE.themes': ['Research themes', 'The four cards on the Home page and the longer descriptions on the Research page.'],
    bio: ['Profile and bio', 'First-person profile and short bio kept for template filling. The About page uses its own text, under Site text.'],
    PUBS: ['Publications', 'Shown on the Publications page and the Home page highlights (the first rows). Authorship role drives the role filter.'],
    projects: ['Projects', 'Shown on the Research page and the Home page. Pending proposals are never published.'],
    PATENTS: ['Patents', ''],
    career: ['Positions and education', 'Shown on the About page.'],
    AWARDS: ['Awards', ''],
    service: ['Roles and teaching', 'Shown on the About page.'],
    person: ['Person and metrics', 'Contact details and the counts shown on the Home page. Date of birth and mobile number cannot be stored here by design.'],
    log: ['Download log', 'The 200 most recent downloads and template requests.'],
    hist: ['Version history', 'Each Publish keeps the previous version. Loading one puts it in the editor; it only goes live when you Publish.']
  };

  async function render() {
    const p = $('#panel'), [t, s] = intro[tab] || ['', ''];
    let h = '<h2>' + E(t) + '</h2>' + (s ? '<p class="sub">' + E(s) + '</p>' : '');
    if (tab === 'site') {
      h += '<div class="kv">' + Object.keys(SITE_LABELS).map((k) => '<div' + (AREA.has(k) ? ' class="wide"' : '') + '><label>' + E(SITE_LABELS[k]) + '</label>' + input(AREA.has(k) ? 'area' : 'text', S.SITE[k] || '', 'data-o="SITE" data-k="' + k + '"') + '</div>').join('') + '</div>';
    } else if (tab === 'SITE.themes' || tab === 'SITE.partners') h += listEditor(tab);
    else if (tab === 'bio') {
      h += '<div class="kv"><div class="wide"><label>Profile (About page, full CV)</label>' + input('area', S.PROFILE || '', 'data-o="ROOT" data-k="PROFILE" rows="8"') + '</div><div class="wide"><label>Short bio (about 100 words)</label>' + input('area', S.SHORT_BIO_100 || '', 'data-o="ROOT" data-k="SHORT_BIO_100"') + '</div><div class="wide"><label>Data version line (shown in the footer)</label>' + input('text', S.DATA_VERSION || '', 'data-o="ROOT" data-k="DATA_VERSION"') + '</div></div>';
    } else if (tab === 'PUBS' || tab === 'PATENTS' || tab === 'AWARDS') h += listEditor(tab);
    else if (tab === 'projects') h += '<p class="note warn">Funders see these amounts and roles. Check each entry against the sanction letter before publishing.</p>' + listEditor('GRANTS_ONGOING') + listEditor('GRANTS_COMPLETED');
    else if (tab === 'career') h += listEditor('POSITIONS') + listEditor('EDUCATION');
    else if (tab === 'service') h += listEditor('ROLES') + listEditor('TEACHING') + listEditor('LEADERSHIP') + listEditor('WORKSHOPS');
    else if (tab === 'person') h += '<h3>Person</h3>' + kvForm(S.PERSON, 'PERSON', null, PERSON_AREA) + '<h3 style="margin-top:2rem">Metrics</h3>' + kvForm(S.BIBLIO, 'BIBLIO', BIBLIO_LABELS);
    else if (tab === 'log') {
      h += '<p class="status" id="logs">Loading...</p><div class="scroll" id="logt"></div>';
    } else if (tab === 'hist') {
      h += '<div id="hl">' + (hist.length ? hist.map((x) => '<div class="hist"><span>' + E(new Date(x.saved_at).toLocaleString()) + '</span><button class="btn ghost sm" type="button" data-a="restore" data-id="' + x.id + '">Load into editor</button></div>').join('') : '<p class="sub">No earlier versions yet.</p>') + '</div>';
    }
    p.innerHTML = h;
    if (tab === 'log') loadLog();
  }

  async function loadLog() {
    try {
      const r = await api('requests'), rows = r.requests || [];
      $('#logs').textContent = rows.length + ' request' + (rows.length === 1 ? '' : 's');
      $('#logt').innerHTML = '<table class="log"><thead><tr><th>When</th><th>Name</th><th>Email</th><th>Agency</th><th>Purpose</th><th>Item</th><th>Status</th></tr></thead><tbody>' + rows.map((x) => '<tr><td>' + E(new Date(x.created_at).toLocaleString()) + '</td><td>' + E(x.requester_name) + '</td><td>' + E(x.requester_email || '') + '</td><td>' + E(x.funding_agency) + '</td><td>' + E(x.purpose) + '</td><td>' + E(x.mode === 'template' ? ('Template: ' + (x.template_name || '')) : x.format_id) + '</td><td>' + E((x.status || '') + (x.email_status ? ' · email ' + x.email_status : '')) + '</td></tr>').join('') + '</tbody></table>';
    } catch (e) { const s = $('#logs'); if (s) { s.className = 'status err'; s.textContent = e.message; } }
  }

  // events
  $('#side').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (!b) return; tab = b.dataset.tab; openRow = ''; buildSide(); render(); window.scrollTo({ top: 0 }); });

  $('#panel').addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.q) { const q = t.value.trim().toLowerCase(); document.querySelectorAll('[data-list="' + t.dataset.q + '"] .row').forEach((r) => { r.hidden = q && !r.dataset.text.includes(q); }); return; }
    if (t.dataset.o) {
      const o = t.dataset.o === 'ROOT' ? S : S[t.dataset.o]; o[t.dataset.k] = t.value; setDirty(); return;
    }
    if (t.dataset.p) {
      const cfg = LISTS[t.dataset.p], arr = getP(t.dataset.p), i = +t.dataset.i;
      if (cfg.str) arr[i] = t.value; else arr[i][+t.dataset.c] = t.value;
      const d = t.closest('details'), r = arr[i];
      d.querySelector('.t').textContent = (cfg.str ? r : r[cfg.t]) || '(untitled)';
      const sb = d.querySelector('.s'); if (sb && !cfg.str) sb.textContent = cfg.s(r) || '';
      d.dataset.text = (cfg.str ? r : r.join(' ')).toLowerCase();
      setDirty();
    }
  });

  $('#panel').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const a = b.dataset.a, p = b.dataset.p, i = +b.dataset.i;
    if (a === 'restore') {
      b.disabled = true;
      try { const r = await api('restore', { id: b.dataset.id }); S = normalise(r.content); setDirty(); tab = 'site'; buildSide(); render(); msg('Earlier version loaded. Press Publish to make it live.', 'dirty'); } catch (er) { msg(er.message, 'err'); b.disabled = false; }
      return;
    }
    const cfg = LISTS[p], arr = getP(p);
    if (a === 'add') { arr.unshift(cfg.str ? '' : cfg.cols.map((c) => (c[1] === 'select' ? c[2][4] : ''))); openRow = p + ':0'; }
    else if (a === 'sort') arr.sort((x, y) => (+y[3] || 0) - (+x[3] || 0));
    else if (a === 'del') {
      if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Confirm delete'; setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Delete'; }, 4000); return; }
      arr.splice(i, 1); openRow = '';
    } else if (a === 'up' && i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; openRow = p + ':' + (i - 1); }
    else if (a === 'down' && i < arr.length - 1) { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; openRow = p + ':' + (i + 1); }
    else return;
    setDirty(); const y = window.scrollY; render(); window.scrollTo({ top: y });
  });

  $('#pub').addEventListener('click', async () => {
    const bad = S.PUBS.findIndex((r) => !String(r[1] || '').trim());
    if (bad >= 0) { msg('Publication ' + (bad + 1) + ' has no title.', 'err'); tab = 'PUBS'; buildSide(); render(); return; }
    ['PUBS', 'GRANTS_ONGOING', 'GRANTS_COMPLETED', 'PATENTS', 'AWARDS', 'POSITIONS', 'EDUCATION', 'ROLES', 'TEACHING', 'LEADERSHIP', 'WORKSHOPS'].forEach((k) => { S[k] = S[k].filter((r) => (Array.isArray(r) ? r.some((c) => String(c || '').trim()) : String(r || '').trim())); });
    S.BIBLIO.papers_listed = S.PUBS.length;
    $('#pub').disabled = true; msg('Publishing...');
    try {
      const r = await api('save', { content: S });
      S = normalise(r.content); saved = snap(); setDirty(); msg('Published. The site now shows these changes.', 'ok');
      try { hist = (await api('get')).history || hist; } catch (_) {}
      if (tab === 'hist') render();
    } catch (e) { msg(e.message, 'err'); $('#pub').disabled = false; }
  });
  $('#dis').addEventListener('click', async () => {
    try { const r = await api('get'); S = normalise(r.content || S); saved = snap(); hist = r.history || hist; render(); setDirty(); msg('Changes discarded.', 'ok'); } catch (e) { msg(e.message, 'err'); }
  });
  $('#bk').addEventListener('click', () => {
    const u = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = u; a.download = 'cv_site_backup_' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
  });
  $('#out').addEventListener('click', () => { if (dirty && !window.confirm('You have unpublished changes. Sign out anyway?')) return; dirty = false; S = null; signedOut(''); $('#ls').textContent = ''; });
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  $('#lf').addEventListener('submit', async (e) => {
    e.preventDefault(); const b = $('#lb'), s = $('#ls'); b.disabled = true; s.className = 'status'; s.textContent = 'Signing in...';
    try {
      const r = await api('login', { passphrase: $('#pw').value });
      token = r.token; try { sessionStorage.setItem('cvadmin', token); } catch (_) {}
      $('#pw').value = ''; s.textContent = '';
      if (S) { $('#login').hidden = true; $('#top-r').hidden = false; $('#app').hidden = false; $('#bottom').hidden = false; } else await start();
    } catch (er) { s.className = 'status err'; s.textContent = er.message; }
    b.disabled = false;
  });

  if (token) start().catch((e) => { signedOut(/expired|Session/i.test(e.message) ? '' : e.message); $('#login').hidden = false; });
})();
</script>
</body></html>
